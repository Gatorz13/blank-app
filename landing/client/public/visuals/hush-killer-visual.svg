      <text x="86" y="318">Alice</text>
      <text x="86" y="378">Bob</text>
      <text x="86" y="438">merchant</text>
      <text x="86" y="498">payroll</text>
      <text x="86" y="558">treasury</text>
      <text x="86" y="618">auditor</text>
