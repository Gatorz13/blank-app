<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Same Payment Activity, Different Visible Structure</title>
  <desc>Public rails expose a readable relationship graph; Hush resolves activity into private state objects.</desc>

  <g id="canvas">
    <rect width="1600" height="900" fill="#0B0F14"/>
  </g>

  <g id="header">
    <text x="800" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">Same Payment Activity. Different Visible Structure.</text>
    <text x="800" y="94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">Public Rails expose relationships. Hush accumulates private state.</text>
  </g>

  <g id="panels">
    <rect x="56" y="126" width="728" height="710" rx="12" fill="#0D131A" stroke="#374151"/>
    <rect x="816" y="126" width="728" height="710" rx="12" fill="#0C1519" stroke="#0E7490"/>
