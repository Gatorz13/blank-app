<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Same payment volume. Different visibility.</title>
  <desc>Identical payment pulses enter both systems; public rails expose graph intelligence while Hush accumulates private state with scoped disclosure.</desc>

  <g id="canvas">
    <rect width="1600" height="900" fill="#0B0F14"/>
  </g>

  <g id="header">
    <text x="800" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#F8FAFC">Same payment volume. Different visibility.</text>
    <text x="800" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">Public rails turn payments into financial intelligence. Hush keeps settlement private and disclosure scoped.</text>
  </g>

  <g id="panels">
    <rect x="56" y="132" width="728" height="680" rx="14" fill="#0E141B" stroke="#334155"/>
    <rect x="816" y="132" width="728" height="680" rx="14" fill="#0C1519" stroke="#0E7490"/>
    <text x="84" y="172" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#F8FAFC">Public Rails</text>
    <text x="844" y="172" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#E0F2FE">Hush</text>
  </g>

  <g id="shared-payment-input">
    <g id="left-input-pulses" fill="#CBD5E1">
      <circle cx="110" cy="242" r="5"/><circle cx="128" cy="242" r="5"/><circle cx="146" cy="242" r="5"/><circle cx="164" cy="242" r="5"/><circle cx="182" cy="242" r="5"/><circle cx="200" cy="242" r="5"/>
    </g>
    <g id="right-input-pulses" fill="#67E8F9">
      <circle cx="870" cy="242" r="5"/><circle cx="888" cy="242" r="5"/><circle cx="906" cy="242" r="5"/><circle cx="924" cy="242" r="5"/><circle cx="942" cy="242" r="5"/><circle cx="960" cy="242" r="5"/>
    </g>
    <line x1="206" y1="242" x2="258" y2="242" stroke="#CBD5E1" stroke-width="1.4"/>
    <line x1="966" y1="242" x2="1018" y2="242" stroke="#67E8F9" stroke-width="1.4"/>
  </g>

  <g id="public-rails-side">
    <g id="public-relationship-graph" stroke="#CBD5E1" stroke-width="1.2">
      <line x1="258" y1="242" x2="328" y2="286"/><line x1="258" y1="242" x2="328" y2="354"/><line x1="258" y1="242" x2="328" y2="422"/>
      <line x1="328" y1="286" x2="418" y2="248"/><line x1="328" y1="286" x2="418" y2="338"/><line x1="328" y1="286" x2="418" y2="438"/>
      <line x1="328" y1="354" x2="418" y2="248"/><line x1="328" y1="354" x2="418" y2="338"/><line x1="328" y1="354" x2="418" y2="438"/><line x1="328" y1="354" x2="418" y2="528"/>
      <line x1="328" y1="422" x2="418" y2="338"/><line x1="328" y1="422" x2="418" y2="438"/><line x1="328" y1="422" x2="418" y2="528"/>
      <line x1="418" y1="248" x2="520" y2="292"/><line x1="418" y1="248" x2="520" y2="398"/>
      <line x1="418" y1="338" x2="520" y2="292"/><line x1="418" y1="338" x2="520" y2="398"/><line x1="418" y1="338" x2="520" y2="500"/>
      <line x1="418" y1="438" x2="520" y2="292"/><line x1="418" y1="438" x2="520" y2="398"/><line x1="418" y1="438" x2="520" y2="500"/>
      <line x1="418" y1="528" x2="520" y2="398"/><line x1="418" y1="528" x2="520" y2="500"/>
      <line x1="520" y1="292" x2="636" y2="262"/><line x1="520" y1="292" x2="636" y2="356"/><line x1="520" y1="292" x2="636" y2="468"/>
      <line x1="520" y1="398" x2="636" y2="262"/><line x1="520" y1="398" x2="636" y2="356"/><line x1="520" y1="398" x2="636" y2="468"/><line x1="520" y1="398" x2="636" y2="560"/>
      <line x1="520" y1="500" x2="636" y2="356"/><line x1="520" y1="500" x2="636" y2="468"/><line x1="520" y1="500" x2="636" y2="560"/>
    </g>

    <g id="public-graph-nodes" fill="#111827" stroke="#94A3B8">
      <circle cx="258" cy="242" r="8"/>
      <circle cx="328" cy="286" r="8"/><circle cx="328" cy="354" r="8"/><circle cx="328" cy="422" r="8"/>
      <circle cx="418" cy="248" r="8"/><circle cx="418" cy="338" r="8"/><circle cx="418" cy="438" r="8"/><circle cx="418" cy="528" r="8"/>
      <circle cx="520" cy="292" r="8"/><circle cx="520" cy="398" r="8"/><circle cx="520" cy="500" r="8"/>
      <circle cx="636" cy="262" r="8"/><circle cx="636" cy="356" r="8"/><circle cx="636" cy="468" r="8"/><circle cx="636" cy="560" r="8"/>
    </g>

    <g id="public-cluster-emphasis" fill="none" stroke="#EF4444">
      <ellipse cx="410" cy="390" rx="112" ry="182" stroke-width="1" opacity="0.35"/>
      <ellipse cx="522" cy="410" rx="120" ry="214" stroke-width="1.2" opacity="0.52"/>
      <ellipse cx="636" cy="420" rx="88" ry="236" stroke-width="1.4" opacity="0.68"/>
    </g>

    <g id="metadata-leakage" stroke="#EF4444" stroke-width="1.3">
      <path d="M636 262 C700 248, 724 220, 748 206"/>
      <path d="M636 356 C700 350, 724 332, 748 322"/>
      <path d="M636 468 C700 478, 724 490, 748 506"/>
      <path d="M636 560 C700 592, 724 626, 748 654"/>
    </g>

    <g id="leakage-endpoints" fill="#111827" stroke="#EF4444">
      <circle cx="756" cy="202" r="9"/><circle cx="756" cy="318" r="9"/><circle cx="756" cy="510" r="9"/><circle cx="756" cy="658" r="9"/>
    </g>

    <text x="84" y="772" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#FCA5A5">Public graph grows with time</text>
  </g>

  <g id="hush-side">
    <g id="hush-private-engine" fill="#082F49" stroke="#0891B2">
      <rect x="1018" y="212" width="472" height="428" rx="12"/>
    </g>

    <g id="hush-activity-lanes" fill="#0B3A4A" stroke="#0891B2">
      <rect x="1040" y="236" width="66" height="376" rx="8"/>
      <rect x="1126" y="236" width="66" height="376" rx="8"/>
      <rect x="1212" y="236" width="66" height="376" rx="8"/>
      <rect x="1298" y="236" width="66" height="376" rx="8"/>
      <rect x="1384" y="236" width="66" height="376" rx="8"/>
    </g>

    <g id="hush-pulse-ticks" fill="#67E8F9">
      <rect x="1056" y="262" width="34" height="6" rx="2"/><rect x="1056" y="306" width="34" height="6" rx="2"/><rect x="1056" y="350" width="34" height="6" rx="2"/><rect x="1056" y="394" width="34" height="6" rx="2"/><rect x="1056" y="438" width="34" height="6" rx="2"/><rect x="1056" y="482" width="34" height="6" rx="2"/><rect x="1056" y="526" width="34" height="6" rx="2"/>
      <rect x="1142" y="262" width="34" height="6" rx="2"/><rect x="1142" y="306" width="34" height="6" rx="2"/><rect x="1142" y="350" width="34" height="6" rx="2"/><rect x="1142" y="394" width="34" height="6" rx="2"/><rect x="1142" y="438" width="34" height="6" rx="2"/><rect x="1142" y="482" width="34" height="6" rx="2"/><rect x="1142" y="526" width="34" height="6" rx="2"/>
      <rect x="1228" y="262" width="34" height="6" rx="2"/><rect x="1228" y="306" width="34" height="6" rx="2"/><rect x="1228" y="350" width="34" height="6" rx="2"/><rect x="1228" y="394" width="34" height="6" rx="2"/><rect x="1228" y="438" width="34" height="6" rx="2"/><rect x="1228" y="482" width="34" height="6" rx="2"/><rect x="1228" y="526" width="34" height="6" rx="2"/>
      <rect x="1314" y="262" width="34" height="6" rx="2"/><rect x="1314" y="306" width="34" height="6" rx="2"/><rect x="1314" y="350" width="34" height="6" rx="2"/><rect x="1314" y="394" width="34" height="6" rx="2"/><rect x="1314" y="438" width="34" height="6" rx="2"/><rect x="1314" y="482" width="34" height="6" rx="2"/><rect x="1314" y="526" width="34" height="6" rx="2"/>
      <rect x="1400" y="262" width="34" height="6" rx="2"/><rect x="1400" y="306" width="34" height="6" rx="2"/><rect x="1400" y="350" width="34" height="6" rx="2"/><rect x="1400" y="394" width="34" height="6" rx="2"/><rect x="1400" y="438" width="34" height="6" rx="2"/><rect x="1400" y="482" width="34" height="6" rx="2"/><rect x="1400" y="526" width="34" height="6" rx="2"/>
    </g>

    <g id="private-state-stack" font-family="JetBrains Mono, Inter, monospace" font-size="10" fill="#CFFAFE">
      <rect x="1040" y="666" width="84" height="18" rx="4" fill="#082F49" stroke="#0891B2"/><text x="1082" y="678" text-anchor="middle">note</text>
      <rect x="1134" y="666" width="84" height="18" rx="4" fill="#082F49" stroke="#0891B2"/><text x="1176" y="678" text-anchor="middle">commitment</text>
      <rect x="1228" y="666" width="84" height="18" rx="4" fill="#082F49" stroke="#0891B2"/><text x="1270" y="678" text-anchor="middle">nullifier</text>
      <rect x="1322" y="666" width="84" height="18" rx="4" fill="#082F49" stroke="#0891B2"/><text x="1364" y="678" text-anchor="middle">note</text>
      <rect x="1416" y="666" width="84" height="18" rx="4" fill="#082F49" stroke="#0891B2"/><text x="1458" y="678" text-anchor="middle">commitment</text>
    </g>

    <g id="state-continuity" stroke="#0891B2" stroke-width="1.2">
      <line x1="1124" y1="675" x2="1134" y2="675"/><line x1="1218" y1="675" x2="1228" y2="675"/><line x1="1312" y1="675" x2="1322" y2="675"/><line x1="1406" y1="675" x2="1416" y2="675"/>
    </g>

    <g id="scoped-receipt">
      <path d="M1458 675 C1490 666, 1514 642, 1528 614" stroke="#67E8F9" stroke-width="1.2" stroke-dasharray="4 3"/>
      <rect x="1500" y="588" width="38" height="24" rx="4" fill="#082F49" stroke="#67E8F9"/>
      <text x="1519" y="603" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9.5" fill="#CFFAFE">receipt</text>
    </g>

    <text x="844" y="772" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#67E8F9">Private state grows with time</text>
  </g>
</svg>
