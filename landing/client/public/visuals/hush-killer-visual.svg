        <rect x="1160" y="236" width="74" height="16" rx="3" fill="#082F49" stroke="#0891B2"/><text x="1197" y="247" text-anchor="middle">cm</text>
        <rect x="1160" y="256" width="74" height="16" rx="3" fill="#082F49" stroke="#0891B2"/><text x="1197" y="267" text-anchor="middle">nf</text>
      </g>
