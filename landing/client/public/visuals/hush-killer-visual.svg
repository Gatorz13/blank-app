      <text x="492" y="700" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FCA5A5">Observer can infer:</text>
      <text x="492" y="720" font-family="Inter, Arial, sans-serif" font-size="12" fill="#F1F5F9">who pays whom, cadence shifts, and settlement dependencies.</text>
      <text x="492" y="738" font-family="Inter, Arial, sans-serif" font-size="12" fill="#F1F5F9">Exposure compounds with every repeated edge.</text>
    </g>
