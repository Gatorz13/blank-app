<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Hush Visibility Comparison — Same Payment Volume, Different Exposure</title>
  <desc>Temporal side-by-side showing transparent rails compounding inferable relationship graphs versus Hush compounding private state.</desc>

  <g id="canvas">
    <rect x="0" y="0" width="1600" height="900" fill="#0B0F14"/>
  </g>

  <g id="header">
    <text x="800" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#F8FAFC">Identical Payment Throughput • Divergent Visibility Surface</text>
    <text x="800" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94A3B8">Time makes transparent rails inferable; time on Hush compounds private state.</text>
  </g>

  <g id="panels">
    <rect x="52" y="112" width="736" height="736" rx="12" fill="#0D131A" stroke="#374151"/>
    <rect x="812" y="112" width="736" height="736" rx="12" fill="#0C1519" stroke="#0E7490"/>

    <text x="80" y="148" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC">Public Rails</text>
    <text x="80" y="170" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94A3B8">Graph readability increases every epoch.</text>

    <text x="840" y="148" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#E0F2FE">Hush</text>
    <text x="840" y="170" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94A3B8">State growth increases without publishing relationship topology.</text>
  </g>

  <g id="temporal-rails">
    <g id="left-epochs">
      <rect x="160" y="204" width="112" height="540" fill="#111827"/>
      <rect x="272" y="204" width="112" height="540" fill="#131A23"/>
      <rect x="384" y="204" width="112" height="540" fill="#151D27"/>
      <rect x="496" y="204" width="112" height="540" fill="#18212D"/>
      <rect x="608" y="204" width="112" height="540" fill="#1B2734"/>

      <text x="216" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748B">t0</text>
      <text x="328" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748B">t1</text>
      <text x="440" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748B">t2</text>
      <text x="552" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748B">t3</text>
      <text x="664" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748B">t4</text>
    </g>

    <g id="right-epochs">
      <rect x="920" y="204" width="112" height="540" fill="#08232D"/>
      <rect x="1032" y="204" width="112" height="540" fill="#082833"/>
      <rect x="1144" y="204" width="112" height="540" fill="#092D39"/>
      <rect x="1256" y="204" width="112" height="540" fill="#0A3240"/>
      <rect x="1368" y="204" width="112" height="540" fill="#0B3847"/>

      <text x="976" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#67E8F9">t0</text>
      <text x="1088" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#67E8F9">t1</text>
      <text x="1200" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#67E8F9">t2</text>
      <text x="1312" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#67E8F9">t3</text>
      <text x="1424" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#67E8F9">t4</text>
    </g>
  </g>

