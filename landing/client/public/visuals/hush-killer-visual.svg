      <circle cx="126" cy="258" r="10" fill="#111827" stroke="#94A3B8"/><text x="148" y="262">issuer</text>
      <circle cx="126" cy="318" r="10" fill="#111827" stroke="#94A3B8"/><text x="148" y="322">Alice</text>
