<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Same Payment Volume, Different Visibility</title>
  <desc>Public rails accumulate inferable graphs; Hush accumulates private state.</desc>

  <g id="canvas">
    <rect width="1600" height="900" fill="#0B0F14"/>
  </g>

  <g id="header">
    <text x="800" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">Same Payment Volume. Different Visibility.</text>
    <text x="800" y="94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">Public rails leak relationships over time. Hush compounds private state.</text>
  </g>

  <g id="panels">
    <rect x="56" y="126" width="728" height="710" rx="12" fill="#0D131A" stroke="#374151"/>
    <rect x="816" y="126" width="728" height="710" rx="12" fill="#0C1519" stroke="#0E7490"/>
    <text x="84" y="164" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#F8FAFC">Public Rails</text>
    <text x="844" y="164" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#E0F2FE">Hush</text>
  </g>

  <g id="timelines" font-family="Inter, Arial, sans-serif" font-size="11">
    <g id="left-time">
      <rect x="176" y="202" width="106" height="548" fill="#111827"/>
      <rect x="282" y="202" width="106" height="548" fill="#131A23"/>
      <rect x="388" y="202" width="106" height="548" fill="#151D27"/>
      <rect x="494" y="202" width="106" height="548" fill="#18212D"/>
      <rect x="600" y="202" width="106" height="548" fill="#1B2734"/>
      <text x="229" y="191" text-anchor="middle" fill="#64748B">t0</text>
      <text x="335" y="191" text-anchor="middle" fill="#64748B">t1</text>
      <text x="441" y="191" text-anchor="middle" fill="#64748B">t2</text>
      <text x="547" y="191" text-anchor="middle" fill="#64748B">t3</text>
      <text x="653" y="191" text-anchor="middle" fill="#64748B">t4</text>
    </g>
    <g id="right-time">
      <rect x="936" y="202" width="106" height="548" fill="#08232D"/>
      <rect x="1042" y="202" width="106" height="548" fill="#082833"/>
      <rect x="1148" y="202" width="106" height="548" fill="#092D39"/>
      <rect x="1254" y="202" width="106" height="548" fill="#0A3240"/>
      <rect x="1360" y="202" width="106" height="548" fill="#0B3847"/>
      <text x="989" y="191" text-anchor="middle" fill="#67E8F9">t0</text>
      <text x="1095" y="191" text-anchor="middle" fill="#67E8F9">t1</text>
      <text x="1201" y="191" text-anchor="middle" fill="#67E8F9">t2</text>
      <text x="1307" y="191" text-anchor="middle" fill="#67E8F9">t3</text>
      <text x="1413" y="191" text-anchor="middle" fill="#67E8F9">t4</text>
    </g>
  </g>

  <g id="actor-rows" font-family="Inter, Arial, sans-serif" font-size="13" fill="#E2E8F0">
